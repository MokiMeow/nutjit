name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # nutjit emits x86-64 machine code, so the runner must be x86-64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make binutils

      - name: Build (warnings are failures)
        run: |
          make clean
          make CXXFLAGS='-std=c++17 -Wall -Wextra -Werror -O2 -Iinclude' all

      - name: Run the expression test suite
        run: make test

      - name: Show generated machine code
        run: make run

      - name: Benchmark smoke test
        run: make bench
